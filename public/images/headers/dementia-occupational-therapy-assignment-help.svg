<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Dementia Occupational Therapy Assignment Help — Allen Cognitive Levels, MCA 2005 and Environmental Modification">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f33"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A9D8F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#457B9D" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Abstract brain network — left side circles representing neurons -->
  <circle cx="870" cy="140" r="80" fill="#2A9D8F" opacity="0.07"/>
  <circle cx="920" cy="220" r="55" fill="#457B9D" opacity="0.1"/>
  <circle cx="820" cy="260" r="40" fill="#2A9D8F" opacity="0.08"/>
  <circle cx="970" cy="160" r="35" fill="#2A9D8F" opacity="0.1"/>
  <circle cx="1050" cy="300" r="90" fill="#1D3557" opacity="0.3"/>
  <circle cx="1120" cy="180" r="60" fill="#2A9D8F" opacity="0.06"/>
  <circle cx="960" cy="350" r="50" fill="#457B9D" opacity="0.1"/>
  <circle cx="1080" cy="430" r="70" fill="#2A9D8F" opacity="0.08"/>
  <circle cx="850" cy="400" r="30" fill="#2A9D8F" opacity="0.07"/>

  <!-- Synapse connection lines -->
  <line x1="870" y1="140" x2="920" y2="220" stroke="#2A9D8F" stroke-width="1.5" opacity="0.15"/>
  <line x1="920" y1="220" x2="820" y2="260" stroke="#2A9D8F" stroke-width="1" opacity="0.1"/>
  <line x1="870" y1="140" x2="970" y2="160" stroke="#457B9D" stroke-width="1.5" opacity="0.12"/>
  <line x1="970" y1="160" x2="1050" y2="300" stroke="#2A9D8F" stroke-width="1" opacity="0.1"/>
  <line x1="1050" y1="300" x2="960" y2="350" stroke="#457B9D" stroke-width="1" opacity="0.12"/>
  <line x1="960" y1="350" x2="1080" y2="430" stroke="#2A9D8F" stroke-width="1.5" opacity="0.1"/>
  <line x1="1120" y1="180" x2="1050" y2="300" stroke="#2A9D8F" stroke-width="1" opacity="0.1"/>
  <line x1="850" y1="400" x2="960" y2="350" stroke="#457B9D" stroke-width="1" opacity="0.1"/>

  <!-- Neuron dots -->
  <circle cx="870" cy="140" r="5" fill="#2A9D8F" opacity="0.5"/>
  <circle cx="920" cy="220" r="4" fill="#2A9D8F" opacity="0.4"/>
  <circle cx="820" cy="260" r="4" fill="#457B9D" opacity="0.4"/>
  <circle cx="970" cy="160" r="4" fill="#2A9D8F" opacity="0.5"/>
  <circle cx="1050" cy="300" r="5" fill="#2A9D8F" opacity="0.4"/>
  <circle cx="1120" cy="180" r="4" fill="#457B9D" opacity="0.4"/>
  <circle cx="960" cy="350" r="5" fill="#2A9D8F" opacity="0.5"/>
  <circle cx="1080" cy="430" r="4" fill="#457B9D" opacity="0.4"/>
  <circle cx="850" cy="400" r="3" fill="#2A9D8F" opacity="0.4"/>

  <!-- Teal accent bar on left -->
  <rect x="80" y="160" width="5" height="220" fill="#2A9D8F" rx="2"/>

  <!-- Main text -->
  <text x="108" y="226" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">Dementia OT</text>
  <text x="108" y="294" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#2A9D8F">Assignment Help</text>

  <!-- Subtitle -->
  <text x="108" y="338" font-family="Inter, Arial, sans-serif" font-size="19" fill="#8ECFC9">Allen Cognitive Levels · MCA 2005 · Environmental Modification</text>

  <!-- Tag pills -->
  <rect x="108" y="362" width="148" height="28" fill="#2A9D8F" opacity="0.2" rx="14"/>
  <text x="182" y="381" font-family="Inter, Arial, sans-serif" font-size="12" fill="#2A9D8F" text-anchor="middle">BSc &amp; MSc Students</text>
  <rect x="266" y="362" width="108" height="28" fill="#457B9D" opacity="0.2" rx="14"/>
  <text x="320" y="381" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8ECFC9" text-anchor="middle">NICE NG97</text>
  <rect x="384" y="362" width="130" height="28" fill="#2A9D8F" opacity="0.15" rx="14"/>
  <text x="449" y="381" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8ECFC9" text-anchor="middle">Kitwood Personhood</text>
</svg>
