<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" role="img" aria-labelledby="tools-title">
  <title id="tools-title">Five Key OT Assessment Tools at a Glance — COPM, AMPS, MOHOST, FIM and Barthel Index scoring systems for occupational therapy case study assignments</title>

  <!-- Background -->
  <rect width="800" height="580" fill="#F4F9FA" rx="8"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="58" fill="#1D3557" rx="8"/>
  <rect x="0" y="44" width="800" height="14" fill="#1D3557"/>
  <text x="400" y="36" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5 Key OT Assessment Tools — At a Glance</text>

  <!-- Column headers -->
  <text x="80" y="80" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#457B9D" text-anchor="middle">TOOL</text>
  <text x="225" y="80" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#457B9D" text-anchor="middle">TYPE</text>
  <text x="370" y="80" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#457B9D" text-anchor="middle">ITEMS &amp; SCALE</text>
  <text x="555" y="80" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#457B9D" text-anchor="middle">KEY THRESHOLD / MCID</text>
  <text x="710" y="80" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#457B9D" text-anchor="middle">SETTING</text>
  <line x1="20" y1="86" x2="780" y2="86" stroke="#C5D9E8" stroke-width="1.5"/>

  <!-- ===== ROW 1: COPM ===== -->
  <rect x="20" y="92" width="760" height="86" fill="#1D3557" rx="6"/>
  <!-- Tool name -->
  <text x="80" y="122" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">COPM</text>
  <text x="80" y="139" font-family="Inter, Arial, sans-serif" font-size="9" fill="#A8D8D0" text-anchor="middle">Canadian Occupational</text>
  <text x="80" y="151" font-family="Inter, Arial, sans-serif" font-size="9" fill="#A8D8D0" text-anchor="middle">Performance Measure</text>
  <line x1="140" y1="96" x2="140" y2="174" stroke="#2A9D8F" stroke-width="1" opacity="0.5"/>
  <!-- Type -->
  <rect x="152" y="104" width="130" height="22" fill="#2A9D8F" rx="11"/>
  <text x="217" y="119" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Self-Report · Client-Centred</text>
  <text x="217" y="142" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">3 occupation categories</text>
  <text x="217" y="157" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Self-care · Productivity · Leisure</text>
  <line x1="295" y1="96" x2="295" y2="174" stroke="#2A9D8F" stroke-width="1" opacity="0.4"/>
  <!-- Scale -->
  <text x="370" y="115" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">3 scales · each 1–10</text>
  <text x="370" y="132" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Importance · Performance · Satisfaction</text>
  <text x="370" y="149" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Top 5 priority problems scored</text>
  <text x="370" y="165" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Admin: 20–40 minutes</text>
  <line x1="450" y1="96" x2="450" y2="174" stroke="#2A9D8F" stroke-width="1" opacity="0.4"/>
  <!-- Threshold -->
  <text x="555" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#52B788" text-anchor="middle">MCID ≥ 2 points</text>
  <text x="555" y="133" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">on performance or satisfaction scale</text>
  <text x="555" y="150" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">= clinically significant change</text>
  <line x1="640" y1="96" x2="640" y2="174" stroke="#2A9D8F" stroke-width="1" opacity="0.4"/>
  <!-- Setting -->
  <text x="710" y="127" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2A9D8F" text-anchor="middle">Any setting</text>
  <text x="710" y="144" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">All populations</text>
  <text x="710" y="161" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Proxy for dementia</text>

  <!-- ===== ROW 2: AMPS ===== -->
  <rect x="20" y="184" width="760" height="86" fill="#F4F9FA" rx="6"/>
  <text x="80" y="214" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D3557" text-anchor="middle">AMPS</text>
  <text x="80" y="231" font-family="Inter, Arial, sans-serif" font-size="9" fill="#457B9D" text-anchor="middle">Assessment of Motor</text>
  <text x="80" y="243" font-family="Inter, Arial, sans-serif" font-size="9" fill="#457B9D" text-anchor="middle">and Process Skills</text>
  <line x1="140" y1="188" x2="140" y2="266" stroke="#C5D9E8" stroke-width="1"/>
  <rect x="152" y="196" width="130" height="22" fill="#457B9D" rx="11"/>
  <text x="217" y="211" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Performance-Based</text>
  <text x="217" y="232" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">Rasch-based logit analysis</text>
  <text x="217" y="248" font-family="Inter, Arial, sans-serif" font-size="10" fill="#E63946" text-anchor="middle">⚠ Certified rater required</text>
  <line x1="295" y1="188" x2="295" y2="266" stroke="#C5D9E8" stroke-width="1"/>
  <text x="370" y="207" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1D3557" text-anchor="middle">36 items total</text>
  <text x="370" y="224" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">16 Motor skill items</text>
  <text x="370" y="241" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">20 Process skill items</text>
  <text x="370" y="258" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">Scores quality, not completion</text>
  <line x1="450" y1="188" x2="450" y2="266" stroke="#C5D9E8" stroke-width="1"/>
  <text x="555" y="207" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D3557" text-anchor="middle">Motor ≥ 2.0 logits</text>
  <text x="555" y="224" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D3557" text-anchor="middle">Process ≥ 1.0 logits</text>
  <text x="555" y="243" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">= independent ADL performance</text>
  <line x1="640" y1="188" x2="640" y2="266" stroke="#C5D9E8" stroke-width="1"/>
  <text x="710" y="220" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1D3557" text-anchor="middle">Cross-diagnostic</text>
  <text x="710" y="237" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">Any setting</text>

  <!-- ===== ROW 3: MOHOST ===== -->
  <rect x="20" y="276" width="760" height="86" fill="#1D3557" rx="6"/>
  <text x="80" y="306" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">MOHOST</text>
  <text x="80" y="323" font-family="Inter, Arial, sans-serif" font-size="9" fill="#A8D8D0" text-anchor="middle">Model of Human</text>
  <text x="80" y="335" font-family="Inter, Arial, sans-serif" font-size="9" fill="#A8D8D0" text-anchor="middle">Occupation Screening Tool</text>
  <line x1="140" y1="280" x2="140" y2="358" stroke="#2A9D8F" stroke-width="1" opacity="0.5"/>
  <rect x="152" y="288" width="130" height="22" fill="#2A9D8F" rx="11"/>
  <text x="217" y="303" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Observational · MOHO-derived</text>
  <text x="217" y="324" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">From clinical notes, observation,</text>
  <text x="217" y="340" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">or MDT information</text>
  <line x1="295" y1="280" x2="295" y2="358" stroke="#2A9D8F" stroke-width="1" opacity="0.4"/>
  <text x="370" y="299" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">24 items · 6 sections</text>
  <text x="370" y="316" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Motivation · Pattern · Communication</text>
  <text x="370" y="333" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Process · Motor · Environment</text>
  <text x="370" y="350" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Admin: 15–20 minutes</text>
  <line x1="450" y1="280" x2="450" y2="358" stroke="#2A9D8F" stroke-width="1" opacity="0.4"/>
  <text x="555" y="299" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#52B788" text-anchor="middle">F · A · I · R scale</text>
  <text x="555" y="316" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Facilitates · Allows · Inhibits · Restricts</text>
  <text x="555" y="333" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Each item rated 1 of 4 levels</text>
  <line x1="640" y1="280" x2="640" y2="358" stroke="#2A9D8F" stroke-width="1" opacity="0.4"/>
  <text x="710" y="313" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2A9D8F" text-anchor="middle">Mental health</text>
  <text x="710" y="330" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Inpatient &amp; community</text>

  <!-- ===== ROW 4: FIM ===== -->
  <rect x="20" y="368" width="760" height="86" fill="#F4F9FA" rx="6"/>
  <text x="80" y="398" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D3557" text-anchor="middle">FIM</text>
  <text x="80" y="415" font-family="Inter, Arial, sans-serif" font-size="9" fill="#457B9D" text-anchor="middle">Functional Independence</text>
  <text x="80" y="427" font-family="Inter, Arial, sans-serif" font-size="9" fill="#457B9D" text-anchor="middle">Measure</text>
  <line x1="140" y1="372" x2="140" y2="450" stroke="#C5D9E8" stroke-width="1"/>
  <rect x="152" y="380" width="130" height="22" fill="#457B9D" rx="11"/>
  <text x="217" y="395" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Observer-rated outcome</text>
  <text x="217" y="416" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">Admission → discharge</text>
  <text x="217" y="432" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">functional gain comparison</text>
  <line x1="295" y1="372" x2="295" y2="450" stroke="#C5D9E8" stroke-width="1"/>
  <text x="370" y="391" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1D3557" text-anchor="middle">18 items · 7-point scale</text>
  <text x="370" y="408" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">13 Motor items (range 13–91)</text>
  <text x="370" y="425" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">5 Cognitive items (range 5–35)</text>
  <text x="370" y="442" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">Total range 18–126</text>
  <line x1="450" y1="372" x2="450" y2="450" stroke="#C5D9E8" stroke-width="1"/>
  <text x="555" y="391" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D3557" text-anchor="middle">7 = complete independence</text>
  <text x="555" y="408" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D3557" text-anchor="middle">1 = total assist</text>
  <text x="555" y="427" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">Levels 2–6 capture assisted range</text>
  <line x1="640" y1="372" x2="640" y2="450" stroke="#C5D9E8" stroke-width="1"/>
  <text x="710" y="406" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1D3557" text-anchor="middle">Inpatient rehab</text>
  <text x="710" y="423" font-family="Inter, Arial, sans-serif" font-size="10" fill="#457B9D" text-anchor="middle">Research contexts</text>

  <!-- ===== ROW 5: Barthel ===== -->
  <rect x="20" y="460" width="760" height="86" fill="#1D3557" rx="6"/>
  <text x="80" y="490" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Barthel</text>
  <text x="80" y="507" font-family="Inter, Arial, sans-serif" font-size="9" fill="#A8D8D0" text-anchor="middle">Barthel Index</text>
  <text x="80" y="519" font-family="Inter, Arial, sans-serif" font-size="9" fill="#A8D8D0" text-anchor="middle">of ADL</text>
  <line x1="140" y1="464" x2="140" y2="542" stroke="#2A9D8F" stroke-width="1" opacity="0.5"/>
  <rect x="152" y="472" width="130" height="22" fill="#2A9D8F" rx="11"/>
  <text x="217" y="487" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Observer-rated · UK NHS</text>
  <text x="217" y="508" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Standard UK stroke unit</text>
  <text x="217" y="524" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">outcome measure (SSNAP)</text>
  <line x1="295" y1="464" x2="295" y2="542" stroke="#2A9D8F" stroke-width="1" opacity="0.4"/>
  <text x="370" y="483" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">10 ADL items</text>
  <text x="370" y="500" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Scoring: 0 / 5 / 10 / 15 per item</text>
  <text x="370" y="517" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Total range 0–100</text>
  <text x="370" y="534" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">Simpler than FIM · basic ADLs only</text>
  <line x1="450" y1="464" x2="450" y2="542" stroke="#2A9D8F" stroke-width="1" opacity="0.4"/>
  <text x="555" y="480" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#52B788" text-anchor="middle">0–20 Total dependence</text>
  <text x="555" y="496" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">21–60 Severe dependence</text>
  <text x="555" y="511" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">61–90 Moderate dependence</text>
  <text x="555" y="526" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">91–99 Slight dependence</text>
  <text x="555" y="541" font-family="Inter, Arial, sans-serif" font-size="10" fill="#52B788" text-anchor="middle">100 = Full independence</text>
  <line x1="640" y1="464" x2="640" y2="542" stroke="#2A9D8F" stroke-width="1" opacity="0.4"/>
  <text x="710" y="497" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2A9D8F" text-anchor="middle">UK NHS stroke</text>
  <text x="710" y="514" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8D8D0" text-anchor="middle">&amp; rehabilitation units</text>

  <!-- Footer -->
  <text x="400" y="572" font-family="Inter, Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">COPM © Law et al · AMPS © Fisher · MOHOST © Parkinson et al · FIM © Uniform Data System · occupationtherapyassignment.help</text>
</svg>
